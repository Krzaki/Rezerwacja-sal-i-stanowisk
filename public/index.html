<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>

<form action="/submit" method="POST">
    <label for="date">Start date:</label>
    <input
    type="date"
    id="date"
    name="date"
    value="2026-07-22"/>

    <label for="time_start">From: </label>
    <input
    type="time"
    id="time_start"
    name="time_start"
    min="09:00"
    max="18:00"
    required />

    <label for="time_end">To: </label>
    <input
    type="time"
    id="time_end"
    name="time_end"
    min="09:00"
    max="18:00"
    required />

    <input type="submit" name="submit_btn" id="submit_form" value="submit"> 
</form>


</body>
</html>
